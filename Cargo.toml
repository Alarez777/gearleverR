[workspace]
resolver = "3"
members = ["crates/gearlever-core", "crates/gearlever"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["Gear Lever R contributors"]
repository = "https://github.com/alarez/gear-leverR"

[workspace.dependencies]
anyhow = "1"
backhand = { version = "0.25", default-features = false, features = ["zstd", "xz", "gzip", "lz4"] }
blake3 = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
http = "1"
md-5 = "0.10"
relm4 = { version = "0.11", features = ["libadwaita"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1"
suppaftp = "12"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
ureq = { version = "3", features = ["json", "gzip"] }
url = "2"
urlencoding = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
