name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: rust:1.98-bookworm
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C link-arg=-L/usr/lib/x86_64-linux-gnu"
      CARGO_TARGET_DIR: /tmp/target
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libglib2.0-bin liblzma-dev zlib1g-dev gettext curl file \
            librsvg2-dev libgirepository1.0-dev libgdk-pixbuf2.0-bin \
            adwaita-icon-theme libgtk-4-bin

      - name: Build
        run: cargo build --release --locked -p gearlever

      - name: Package AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          GEARLEVER_R_BINARY=/tmp/target/release/gearlever-r \
          APPIMAGETOOL=/tmp/appimagetool \
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./packaging/appimage/build.sh

      - name: Verify AppImage runtime
        run: |
          appimage=$(echo dist/GearLeverR-*-x86_64.AppImage)
          "$appimage" --appimage-offset
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version | grep -q '^gearlever-r '

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.sha256
