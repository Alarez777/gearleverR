name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            triplet: x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            triplet: aarch64-linux-gnu
    runs-on: ${{ matrix.runner }}
    container: rust:1.98-bookworm
    env:
      ARCH: ${{ matrix.arch }}
      RUSTFLAGS: "-C link-arg=-L/usr/lib/${{ matrix.triplet }}"
      CARGO_TARGET_DIR: /tmp/target
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq pkg-config libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libglib2.0-bin liblzma-dev zlib1g-dev xz-utils gettext \
            curl file librsvg2-dev libgirepository1.0-dev libgdk-pixbuf2.0-bin \
            adwaita-icon-theme libgtk-4-bin

      - name: Build
        run: cargo build --release --locked -p gearlever

      - name: Package AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x /tmp/appimagetool
          GEARLEVER_R_BINARY=/tmp/target/release/gearlever-r \
          APPIMAGETOOL=/tmp/appimagetool \
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./packaging/appimage/build.sh

      - name: Verify AppImage runtime
        run: |
          set -- dist/GearLeverR-*-"${ARCH}".AppImage
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "error: expected exactly one GearLeverR-*-${ARCH}.AppImage in dist" >&2
            exit 1
          fi
          appimage=$1
          "$appimage" --appimage-offset
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version | grep -q '^gearlever-r '

      - name: Verify bundled DwarFS extractor
        run: |
          set -- dist/GearLeverR-*-"${ARCH}".AppImage
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "error: expected exactly one GearLeverR-*-${ARCH}.AppImage in dist" >&2
            exit 1
          fi
          appimage=$1
          "$appimage" --appimage-extract >/dev/null
          ./squashfs-root/usr/bin/dwarfsextract --help | grep -q 'dwarfsextract'
          rm -rf squashfs-root AppDir

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.sha256
