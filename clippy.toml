# BeautifulRust clippy configuration, shared by the whole workspace.

max-fn-params-bools = 0

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true

# Proper nouns used in the docs; keep clippy's defaults and add ours.
doc-valid-idents = [
    "AppImage",
    "AppImages",
    "AArch64",
    "x86_64",
    "aarch64",
    "SquashFS",
    "DwarFS",
    "ISO9660",
    "GSettings",
    "libadwaita",
    "Relm4",
    "ELF",
    "..",
]
